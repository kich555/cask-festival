<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CASK CARNIVAL — Hero</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; background:#07050a; overflow:hidden; }

  /* fixed 1920x1080 canvas, scaled to COVER the viewport (crops sides when narrow) */
  #stage{ position:fixed; inset:0; background:#07050a; }
  #canvas{
    position:absolute; left:50%; top:50%;
    width:1920px; height:1080px;
    transform-origin:50% 50%;
    transform:translate(-50%,-50%) scale(1);
    overflow:hidden;
    background:
      radial-gradient(78% 90% at 50% 50%, #2a0710 0%, #160810 40%, #0a0509 72%, #060409 100%);
    font-family:"Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  /* rich vignette */
  #canvas::after{
    content:""; position:absolute; inset:0; pointer-events:none; z-index:7;
    background:radial-gradient(120% 100% at 50% 48%, transparent 50%, rgba(0,0,0,.66) 100%);
  }

  /* ---- soft crimson glow behind the logo (no hard edges → no alignment to fuss over) ---- */
  .glow{
    position:absolute; left:50%; top:50%;
    width:1320px; height:1320px; transform:translate(-50%,-50%);
    background:radial-gradient(circle,
      rgba(180,30,55,.50) 0%,
      rgba(140,16,34,.30) 24%,
      rgba(120,12,28,.12) 44%,
      transparent 64%);
    filter:blur(10px); z-index:1;
    animation:breathe 5.5s ease-in-out infinite;
  }
  .glow--2{
    width:760px; height:760px;
    background:radial-gradient(circle, rgba(255,120,140,.30) 0%, rgba(180,30,55,.14) 40%, transparent 66%);
    filter:blur(16px); z-index:1;
    animation:breathe 4s ease-in-out infinite reverse;
  }
  @keyframes breathe{
    0%,100%{ transform:translate(-50%,-50%) scale(1);    opacity:.9; }
    50%    { transform:translate(-50%,-50%) scale(1.06);  opacity:1;  }
  }

  /* ---- slow rotating light sweep (soft, blurred → no hard ring) ---- */
  .rays{
    position:absolute; left:50%; top:50%;
    width:1700px; height:1700px; transform:translate(-50%,-50%);
    z-index:1; border-radius:50%; opacity:.5;
    background:conic-gradient(from 0deg,
      transparent 0deg, rgba(190,44,66,.18) 14deg, transparent 30deg,
      transparent 70deg, rgba(255,120,140,.12) 86deg, transparent 104deg,
      transparent 150deg, rgba(190,44,66,.16) 166deg, transparent 184deg,
      transparent 234deg, rgba(255,120,140,.10) 250deg, transparent 268deg,
      transparent 318deg, rgba(190,44,66,.14) 334deg, transparent 352deg);
    filter:blur(34px);
    -webkit-mask:radial-gradient(circle, #000 22%, rgba(0,0,0,.5) 48%, transparent 72%);
            mask:radial-gradient(circle, #000 22%, rgba(0,0,0,.5) 48%, transparent 72%);
    animation:sweep 38s linear infinite;
  }
  @keyframes sweep{ to{ transform:translate(-50%,-50%) rotate(360deg); } }

  /* ---- flowing amber/crimson liquid currents (cask-spirit feel) ---- */
  .flow{ position:absolute; inset:-12%; z-index:1; pointer-events:none; filter:blur(64px); opacity:.6; }
  .flow span{ position:absolute; border-radius:50%; mix-blend-mode:screen; will-change:transform; }
  .flow .a{ width:900px; height:680px; left:16%; top:42%;
    background:radial-gradient(circle, rgba(214,132,46,.55), transparent 66%); animation:flowA 18s ease-in-out infinite; }
  .flow .b{ width:820px; height:820px; left:58%; top:54%;
    background:radial-gradient(circle, rgba(176,32,58,.60), transparent 64%); animation:flowB 22s ease-in-out infinite; }
  .flow .c{ width:640px; height:520px; left:44%; top:26%;
    background:radial-gradient(circle, rgba(235,170,80,.45), transparent 66%); animation:flowC 26s ease-in-out infinite; }
  @keyframes flowA{ 0%,100%{transform:translate(0,0) scale(1);} 30%{transform:translate(140px,-70px) scale(1.18);} 60%{transform:translate(-90px,50px) scale(.92);} }
  @keyframes flowB{ 0%,100%{transform:translate(0,0) scale(1);} 35%{transform:translate(-130px,-40px) scale(1.12);} 70%{transform:translate(70px,70px) scale(.96);} }
  @keyframes flowC{ 0%,100%{transform:translate(0,0) scale(1);} 40%{transform:translate(90px,80px) scale(1.2);} 75%{transform:translate(-60px,-50px) scale(.9);} }

  /* ---- rising embers ---- */
  .embers{ position:absolute; inset:0; z-index:3; pointer-events:none; }
  .embers i{
    position:absolute; width:5px; height:5px; border-radius:50%;
    background:radial-gradient(circle, #ffd9a0 0%, #ff7a4a 45%, #b3203a 70%, transparent 78%);
    box-shadow:0 0 8px rgba(255,140,90,.6);
    opacity:0; animation:rise linear infinite;
  }
  @keyframes rise{
    0%  { transform:translate(0,40px) scale(.6); opacity:0; }
    12% { opacity:.95; }
    82% { opacity:.85; }
    100%{ transform:translate(var(--dx,0),-160px) scale(1.05); opacity:0; }
  }

  /* ---- 3D rotating logo (centered, no concentric dependencies) ---- */
  .logo-scene{
    position:absolute; left:500px; top:243px;
    width:920px; height:594px;
    perspective:1950px; perspective-origin:50% 48%;
    z-index:4;
    transform:translateY(-120px) scale(.68);   /* 데스크톱: 조금 크게 + 위로 */
    transform-origin:50% 50%;
  }
  /* 데스크톱(가로형)에서 화면 세로가 짧아지면 플로팅을 줄여 하단 텍스트와 겹치지 않게 */
  @media (min-aspect-ratio: 13/10) and (max-height: 860px){
    .logo-scene{ transform:translateY(-96px) scale(.56); }
  }
  @media (min-aspect-ratio: 13/10) and (max-height: 720px){
    .logo-scene{ transform:translateY(-72px) scale(.46); }
  }
  .tilt{
    position:absolute; inset:0; transform-style:preserve-3d;
    transform:rotateX(10deg);
    animation:bob 6.5s ease-in-out infinite;   /* 은은한 부유 모션 */
  }
  @keyframes bob{
    0%,100%{ transform:rotateX(10deg) translateY(0); }
    50%    { transform:rotateX(10deg) translateY(-16px); }
  }
  .coin{ position:absolute; inset:0; transform-style:preserve-3d; animation:sway 7s ease-in-out infinite; will-change:transform; }
  @keyframes sway{ 0%,100%{ transform:rotateY(-20deg);} 50%{ transform:rotateY(20deg);} }
  .slice{ position:absolute; inset:0; }
  .slice svg{ width:100%; height:100%; display:block; }
  .slice.face svg{
    filter:drop-shadow(0 0 16px rgba(190,40,62,.85)) drop-shadow(0 0 40px rgba(125,11,28,.55));
  }

  /* ---- 모바일(세로 화면): 원/로고가 잘리거나 넘치지 않도록 작게 + 위로 ---- */
  @media (max-aspect-ratio: 13/10){
    .logo-scene{ transform:translateY(-130px) scale(.58); }
    .glow{ width:920px; height:920px; }
    .glow--2{ width:560px; height:560px; }
    .rays{ width:1160px; height:1160px; opacity:.42; }
  }
  @media (max-width: 560px){
    .logo-scene{ transform:translateY(-170px) scale(.52); }
    .glow{ width:780px; height:780px; }
    .glow--2{ width:480px; height:480px; }
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="canvas">
      <div class="flow"><span class="a"></span><span class="b"></span><span class="c"></span></div>
      <div class="rays"></div>
      <div class="glow"></div>
      <div class="glow glow--2"></div>
      <div class="embers" id="embers"></div>

      <div class="logo-scene">
        <div class="tilt"><div class="coin" id="coin"></div></div>
      </div>
    </div>
  </div>

  <script>
    // scale the fixed canvas to COVER the viewport (center stays put, sides crop when narrow)
    (function(){
      const canvas = document.getElementById('canvas');
      function fit(){
        const s = Math.max(innerWidth/1920, innerHeight/1080);
        canvas.style.transform = `translate(-50%,-50%) scale(${s})`;
      }
      addEventListener('resize', fit); fit();
    })();

    // build the extruded 3D logo (ring + wordmark as one solid piece)
    (function(){
      const coin = document.getElementById('coin');
      const tpl  = document.getElementById('logoTpl');
      const RIM=22, DEPTH=34, half=DEPTH/2;
      function makeSlice(z, ink, cls){
        const s=document.createElement('div');
        s.className='slice'+(cls?' '+cls:'');
        s.appendChild(tpl.content.cloneNode(true));
        if(ink) s.style.setProperty('--ink', ink);
        s.style.transform=`translateZ(${z}px)`;
        coin.appendChild(s);
      }
      const deep=[40,8,14], bright=[150,34,50];
      for(let i=0;i<RIM;i++){
        const t=i/(RIM-1), edge=Math.abs(t*2-1);
        const c=deep.map((d,k)=>Math.round(d+(bright[k]-d)*edge));
        makeSlice(-half+t*DEPTH, `rgb(${c[0]},${c[1]},${c[2]})`);
      }
      makeSlice(half, '#fff1ec', 'face'); // luminous readable front
    })();

    // rising embers
    (function(){
      const box=document.getElementById('embers'), N=30;
      for(let i=0;i<N;i++){
        const e=document.createElement('i');
        const fast=Math.random()<0.3;                       // 일부는 빠른 불꽃
        const dur=(fast?3+Math.random()*2:6+Math.random()*7), sc=0.5+Math.random()*1.1;
        e.style.left=(6+Math.random()*88)+'%';
        e.style.top =(55+Math.random()*42)+'%';
        e.style.setProperty('--dx', (Math.random()*60-30).toFixed(0)+'px');
        e.style.animationDuration=dur+'s';
        e.style.animationDelay=(-Math.random()*dur)+'s';
        e.style.width=e.style.height=(4*sc).toFixed(1)+'px';
        box.appendChild(e);
      }
    })();
  </script>

<style id="ogfreeze">
  *{ animation-play-state: paused !important; }
  #coin{ transform: rotateY(-7deg) !important; }
  .logo-scene{ transform: translateY(4px) scale(1.7) !important; }
</style>
</body>
</html>
